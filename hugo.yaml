baseURL: https://yumfam.com/
languageCode: en-us
locale: en-us
title: YumFam
theme: PaperMod
enableRobotsTXT: true

params:
  description: "YumFam — Family-friendly hotel buffet guides and resort deals across China, in English."
  author: YumFam
  defaultTheme: light

menu:
  main:
    - name: Buffets
      url: /buffets/
      weight: 10
    - name: Resorts
      url: /resorts/
      weight: 20
    - name: Family Packages
      url: /family-packages/
      weight: 30
    - name: About
      url: /about/
      weight: 40

outputs:
  home: [HTML, RSS, md]
  page: [HTML, md]
  section: [HTML, RSS, md]

mediaTypes:
  text/markdown:
    suffixes: [md]

outputFormats:
  md:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

markup:
  goldmark:
    renderer:
      unsafe: true
